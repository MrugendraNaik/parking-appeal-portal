# Experiment 14: manual rollback to the previous stable release.
#   ansible-playbook rollback.yml -K
- name: Roll back to the previous stable release
  hosts: appservers
  become: true

  tasks:
    - name: Read release history
      ansible.builtin.slurp:
        src: "{{ app_home }}/releases/{{ item }}"
      loop: [current_tag, previous_tag]
      register: tags

    - name: Work out the target release
      ansible.builtin.set_fact:
        from_tag: "{{ tags.results[0].content | b64decode | trim }}"
        to_tag: "{{ tags.results[1].content | b64decode | trim }}"

    - name: Switch container to {{ to_tag }}
      community.docker.docker_container:
        name: "{{ app_name }}"
        image: "{{ image_repo }}:{{ to_tag }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ app_port }}:8080"
        env_file: "{{ app_home }}/app.env"
        env:
          APP_BUILD: "{{ to_tag }}"
          APP_SIMULATE_FAILURE: "false"
        volumes:
          - "{{ app_home }}/data:/app/data"

    - name: Health check
      ansible.builtin.uri:
        url: "{{ health_url }}"
        status_code: 200
      register: health
      until: health.status == 200
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"

    - name: Swap release markers
      ansible.builtin.copy:
        content: "{{ item.value }}\n"
        dest: "{{ app_home }}/releases/{{ item.key }}"
        mode: "0644"
      loop:
        - { key: current_tag, value: "{{ to_tag }}" }
        - { key: previous_tag, value: "{{ from_tag }}" }

    - name: Result
      ansible.builtin.debug:
        msg: "Rolled back from {{ from_tag }} to {{ to_tag }} - service healthy."
