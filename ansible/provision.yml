# Experiment 13: configure the target node with all server prerequisites.
#   ansible-playbook provision.yml -K
- name: Provision node for the Parking Violation Appeal Portal
  hosts: appservers
  become: true

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Docker service is running and enabled at boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: true

    - name: Create application user (member of docker group)
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        groups: docker
        append: true
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create application folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0750"
      loop:
        - "{{ app_home }}"
        - "{{ app_home }}/releases"
        - "{{ app_home }}/logs"

    - name: Create data folder writable by the container user
      ansible.builtin.file:
        path: "{{ app_home }}/data"
        state: directory
        owner: "{{ app_container_uid }}"
        group: "{{ app_group }}"
        mode: "0770"

    - name: Write environment file
      ansible.builtin.template:
        src: templates/app.env.j2
        dest: "{{ app_home }}/app.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"

    - name: Install health-check helper script
      ansible.builtin.template:
        src: templates/healthcheck.sh.j2
        dest: /usr/local/bin/{{ app_name }}-health
        mode: "0755"

    - name: Open application port in the firewall (optional)
      community.general.ufw:
        rule: allow
        port: "{{ app_port }}"
        proto: tcp
      when: manage_firewall | bool
