# Experiment 14: deploy a release, health-check it, and roll back automatically if it is unhealthy.
#   ansible-playbook deploy.yml -K -e image_tag=1.0.0
#   ansible-playbook deploy.yml -K -e image_tag=1.1.0 -e simulate_failure=true   (rollback drill)
- name: Deploy Parking Violation Appeal Portal container
  hosts: appservers
  become: true

  tasks:
    - name: Read current release tag (if any)
      ansible.builtin.slurp:
        src: "{{ app_home }}/releases/current_tag"
      register: current_raw
      failed_when: false

    - name: Remember current release
      ansible.builtin.set_fact:
        current_tag: "{{ (current_raw.content | b64decode | trim) if current_raw.content is defined else '' }}"

    - name: Pull image {{ image_repo }}:{{ image_tag }}
      community.docker.docker_image:
        name: "{{ image_repo }}"
        tag: "{{ image_tag }}"
        source: pull

    - name: Deploy, verify, and roll back on failure
      block:
        - name: Run container {{ app_name }} ({{ image_tag }})
          community.docker.docker_container:
            name: "{{ app_name }}"
            image: "{{ image_repo }}:{{ image_tag }}"
            state: started
            restart_policy: unless-stopped
            published_ports:
              - "{{ app_port }}:8080"
            env_file: "{{ app_home }}/app.env"
            env:
              APP_BUILD: "{{ image_tag }}"
              APP_SIMULATE_FAILURE: "{{ simulate_failure | string | lower }}"
            volumes:
              - "{{ app_home }}/data:/app/data"

        - name: Health check {{ health_url }}
          ansible.builtin.uri:
            url: "{{ health_url }}"
            status_code: 200
          register: health
          until: health.status == 200
          retries: "{{ health_retries }}"
          delay: "{{ health_delay }}"

        - name: Record previous release
          ansible.builtin.copy:
            content: "{{ current_tag }}\n"
            dest: "{{ app_home }}/releases/previous_tag"
            mode: "0644"
          when: current_tag | length > 0 and current_tag != image_tag

        - name: Record current release
          ansible.builtin.copy:
            content: "{{ image_tag }}\n"
            dest: "{{ app_home }}/releases/current_tag"
            mode: "0644"

        - name: Deployment result
          ansible.builtin.debug:
            msg: "Release {{ image_tag }} is healthy on port {{ app_port }} (status {{ health.json.status }})"

      rescue:
        - name: Health check failed - starting rollback
          ansible.builtin.debug:
            msg: "Release {{ image_tag }} is UNHEALTHY. Rolling back to '{{ current_tag | default('none', true) }}'."

        - name: Stop here if there is no earlier release to return to
          ansible.builtin.fail:
            msg: "No previous stable release recorded - cannot roll back."
          when: current_tag | length == 0

        - name: Re-deploy previous stable release {{ current_tag }}
          community.docker.docker_container:
            name: "{{ app_name }}"
            image: "{{ image_repo }}:{{ current_tag }}"
            state: started
            restart_policy: unless-stopped
            published_ports:
              - "{{ app_port }}:8080"
            env_file: "{{ app_home }}/app.env"
            env:
              APP_BUILD: "{{ current_tag }}"
              APP_SIMULATE_FAILURE: "false"
            volumes:
              - "{{ app_home }}/data:/app/data"

        - name: Health check after rollback
          ansible.builtin.uri:
            url: "{{ health_url }}"
            status_code: 200
          register: health_after
          until: health_after.status == 200
          retries: "{{ health_retries }}"
          delay: "{{ health_delay }}"

        - name: Report rollback
          ansible.builtin.fail:
            msg: "Deployment of {{ image_tag }} FAILED and was ROLLED BACK. Service restored on {{ current_tag }}."
