# ---------------- Parking Violation Appeal Portal ----------------
spring.application.name=parking-appeal

# Values filled in by Maven at build time
app.version=@project.version@
app.build=${APP_BUILD:local}

# Environment-specific settings (override with environment variables,
# -D system properties, --args, or Tomcat context <Parameter> entries)
app.env=${APP_ENV:dev}
app.reviewer-key=${REVIEWER_KEY:reviewer123}
app.data-dir=${APP_DATA_DIR:./data}
app.simulate-failure=${APP_SIMULATE_FAILURE:false}
app.test-support=${APP_TEST_SUPPORT:false}

# Business rules
app.appeal-window-days=30
app.max-evidence-bytes=2097152

# Database: file-based H2 inside the data directory (survives restarts / container volume)
spring.datasource.url=jdbc:h2:file:${app.data-dir}/appealdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Uploads (app enforces 2 MB itself to give a friendly message)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.port=${PORT:8080}
server.error.include-message=always

# Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Parking Violation Appeal Portal
info.app.version=@project.version@
info.app.environment=${app.env}
